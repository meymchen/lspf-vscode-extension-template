name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: npm --prefix extension ci
      - run: npm --prefix extension test
      - run: npm --prefix extension run bundle
      - name: Package Linux extension
        run: >-
          npm --prefix extension run package --
          --target linux-x64
          --out lspf-hello-linux-x64.vsix
      - name: Verify packaged language server
        run: |
          test -s extension/lspf-hello-linux-x64.vsix
          test "$(unzip -p extension/lspf-hello-linux-x64.vsix extension/server/lspf-hello | wc -c)" -gt 0
