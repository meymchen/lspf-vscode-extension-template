name: Template smoke test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  generate:
    if: github.repository == 'meymchen/lspf-vscode-extension-template'
    runs-on: ubuntu-latest
    env:
      CARGO_GENERATE_VERSION: "0.24.0"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
      - name: Cache cargo-generate
        id: cache-cargo-generate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-generate
          key: cargo-generate-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_GENERATE_VERSION }}
      - name: Install cargo-generate
        if: steps.cache-cargo-generate.outputs.cache-hit != 'true'
        run: cargo install cargo-generate --version "$CARGO_GENERATE_VERSION" --locked
      - name: Create generation destination
        run: mkdir -p ../generated
      - name: Generate a project without prompts
        run: |
          cargo generate --path . --destination ../generated \
            --name generated-language --silent \
            --define display_name="Generated Language" \
            --define publisher="template-ci" \
            --define language_id="generated-language" \
            --define file_extension=".generated"
      - run: cargo test
        working-directory: ../generated/generated-language
      - run: npm ci
        working-directory: ../generated/generated-language/extension
      - run: npm test
        working-directory: ../generated/generated-language/extension
      - name: Ensure template-only files were removed
        working-directory: ../generated/generated-language
        run: |
          test ! -e cargo-generate.toml
          test ! -e Cargo.toml.liquid
          test ! -e README.md.liquid
          test ! -e extension/package.json.liquid
          test ! -e extension/README.md.liquid
          test ! -e .github/workflows/template.yml
